<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your auction sold!</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <h2 style="color: #333333;">Great news <span th:text="${sellerUsername}">Seller</span>!</h2>
        <p style="color: #555555; line-height: 1.6;">Your auction for <strong><span th:text="${auctionTitle}">Auction Title</span></strong> has successfully ended.</p>
        
        <div style="background-color: #f8f9fa; padding: 15px; border-radius: 4px; margin: 25px 0;">
            <p style="margin: 0 0 10px 0; color: #333;"><strong>Final Price:</strong> <span th:text="${finalPrice}">100.00</span> EUR</p>
            <p style="margin: 0 0 10px 0; color: #333;"><strong>Winning Bidder:</strong> <span th:text="${winnerUsername}">WinnerUser</span></p>
            <p style="margin: 0; color: #333;"><strong>Contact:</strong> <a th:href="'mailto:' + ${winnerEmail}" th:text="${winnerEmail}" style="color: #007bff; text-decoration: none;">winner@example.com</a></p>
        </div>
        
        <p style="color: #555555; line-height: 1.6;">The winning bidder should be reaching out to you shortly to arrange payment and delivery.</p>
        
        <hr style="border: none; border-top: 1px solid #eeeeee; margin: 30px 0;">
        <p style="color: #999999; font-size: 12px; text-align: center;">&copy; 2026 FinalBid. All rights reserved.</p>
    </div>
</body>
</html>
