server.port=8082

# Application
spring.application.name=notification-service

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finalbid}
spring.datasource.username=${DB_USERNAME:finalbid}
spring.datasource.password=${DB_PASSWORD:AApa33word}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=notification_schema

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=notification_schema
spring.flyway.default-schema=notification_schema
# Create schema if it doesn't exist
spring.flyway.create-schemas=true

# Kafka (used in default profile)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Mail settings
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.default-encoding=UTF-8

# Thymeleaf caching for dev
spring.thymeleaf.cache=false

# Cross-service communication
app.user-service-url=http://user-service:8081

#---
spring.config.activate.on-profile=aws
spring.kafka.bootstrap-servers=disabled
# In AWS, uses SQS configured via spring-cloud-aws
spring.cloud.aws.region.static=${AWS_REGION}
# Mail settings for SES
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
