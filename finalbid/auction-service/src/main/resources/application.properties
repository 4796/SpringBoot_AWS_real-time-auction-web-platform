# ═══════════════════════════════════════════════
# auction-service — application.properties
# Default profile (local Docker Compose)
# ═══════════════════════════════════════════════

# ── Server ──────────────────────────────────────
server.port=8080

# ── DataSource ──────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finalbid}
spring.datasource.username=${DB_USERNAME:finalbid}
spring.datasource.password=${DB_PASSWORD:AApa33word}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=auction_schema

# ── Flyway ──────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=auction_schema
spring.flyway.default-schema=auction_schema
spring.flyway.create-schemas=true

# ── Redis ────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── JWT ─────────────────────────────────────────
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seQ==}

# ── AWS / S3 (LocalStack locally) ───────────────
aws.region=${AWS_REGION:eu-central-1}
aws.endpoint-override=${AWS_ENDPOINT_OVERRIDE:http://localhost:4566}
aws.s3.bucket=${AWS_S3_BUCKET:finalbid-images}

# ── Kafka (local profile) ────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true

# ── Kafka Topics ─────────────────────────────────
kafka.topic.auction-created=finalbid.auction.created
kafka.topic.bid-placed=finalbid.bid.placed
kafka.topic.auction-ended=finalbid.auction.ended

# ── SNS ARNs (aws profile only — ignored locally) ──
sns.auction-created-arn=${SNS_AUCTION_CREATED_ARN:}
sns.bid-placed-arn=${SNS_BID_PLACED_ARN:}
sns.auction-ended-arn=${SNS_AUCTION_ENDED_ARN:}

# ── Spring Cloud AWS (disabled locally) ──────────
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:test}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:test}
spring.cloud.aws.region.static=${AWS_REGION:eu-central-1}
spring.cloud.aws.sns.enabled=false

# ── Actuator ─────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── App ──────────────────────────────────────────
app.base-url=${BASE_URL:http://localhost}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost}

# ── Logging ──────────────────────────────────────
logging.level.com.finalbid=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
