# ═══════════════════════════════════════════════
# user-service — application.properties
# Default profile (local Docker Compose)
# ═══════════════════════════════════════════════

# ── Server ──────────────────────────────────────
server.port=8081

# ── DataSource ──────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finalbid}
spring.datasource.username=${DB_USERNAME:finalbid}
spring.datasource.password=${DB_PASSWORD:AApa33word}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=user_schema

# ── Flyway ──────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=user_schema
spring.flyway.default-schema=user_schema
spring.flyway.create-schemas=true

# ── Redis ────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── JWT ─────────────────────────────────────────
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seQ==}
jwt.access-expiry-ms=${JWT_ACCESS_EXPIRY_MS:900000}
jwt.refresh-expiry-days=${JWT_REFRESH_EXPIRY_DAYS:7}

# ── AWS / S3 (LocalStack locally) ───────────────
aws.region=${AWS_REGION:eu-central-1}
aws.endpoint-override=${AWS_ENDPOINT_OVERRIDE:http://localhost:4566}
aws.s3.bucket=${AWS_S3_BUCKET:finalbid-images}

# ── Kafka (local profile) ────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true

# ── Kafka Topics ─────────────────────────────────
kafka.topic.user-registered=finalbid.user.registered

# ── SNS ARNs (aws profile only — ignored locally) ──
sns.user-registered-arn=${SNS_USER_REGISTERED_ARN:}

# ── Spring Cloud AWS (disabled locally) ──────────
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:test}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:test}
spring.cloud.aws.region.static=${AWS_REGION:eu-central-1}
spring.cloud.aws.sns.enabled=false

# ── Mail ─────────────────────────────────────────
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ── App ──────────────────────────────────────────
app.from-email=${FROM_EMAIL:noreply@finalbid.com}
app.base-url=${BASE_URL:http://localhost}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost}

# ── Actuator ─────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Logging ──────────────────────────────────────
logging.level.com.finalbid=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
