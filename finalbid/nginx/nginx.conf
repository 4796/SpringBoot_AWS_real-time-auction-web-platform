worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # ─── Upstreams ────────────────────────────────────────────────────────────
    # Regular HTTP load balancing to auction-service (least_conn)
    upstream auction_upstream {
        least_conn;
        server auction-service:8080;
    }

    # Regular HTTP load balancing to user-service (least_conn)
    upstream user_upstream {
        least_conn;
        server user-service:8081;
    }

    # Sticky WebSocket upstream (ip_hash) — WebSocket is a persistent connection;
    # once established all frames must go to the same instance.
    upstream auction_ws_upstream {
        ip_hash;
        server auction-service:8080;
    }

    # ─── Server ───────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── WebSocket endpoint (sticky, ip_hash) ──────────────────────────────
        location /ws {
            proxy_pass http://auction_ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Auth endpoints → user-service ─────────────────────────────────────
        location /api/auth/ {
            proxy_pass http://user_upstream;
            proxy_read_timeout 30s;
        }

        # ── User endpoints → user-service ─────────────────────────────────────
        location /api/users/ {
            proxy_pass http://user_upstream;
            proxy_read_timeout 30s;
        }

        # ── Everything else → auction-service ─────────────────────────────────
        location / {
            proxy_pass http://auction_upstream;
            proxy_read_timeout 60s;
        }
    }
}
