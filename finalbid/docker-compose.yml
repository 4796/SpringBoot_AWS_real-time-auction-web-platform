services:

  # ──────────────────────────────────────────────
  # POSTGRES
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: finalbid-postgres
    environment:
      POSTGRES_DB: finalbid
      POSTGRES_USER: ${DB_USERNAME:-finalbid}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-AApa33word}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finalbid-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U finalbid -d finalbid" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # KAFKA (KRaft mode – no ZooKeeper)
  # ──────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: finalbid-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    networks:
      - finalbid-net
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 15s
      timeout: 10s
      retries: 10

  # ──────────────────────────────────────────────
  # REDIS
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: finalbid-redis
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    networks:
      - finalbid-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # LOCALSTACK (S3 only)
  # ──────────────────────────────────────────────
  localstack:
    image: localstack/localstack:3.4
    container_name: finalbid-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: eu-central-1
      AWS_DEFAULT_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./localstack-init.sh:/etc/localstack/init/ready.d/init.sh
      - localstack_data:/var/lib/localstack
    networks:
      - finalbid-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────
  # MAILPIT (local email catcher)
  # ──────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: finalbid-mailpit
    ports:
      - "8025:8025" # Web UI
    networks:
      - finalbid-net
    environment:
      MP_MAX_MESSAGES: 500

  # ──────────────────────────────────────────────
  # USER-SERVICE
  # ──────────────────────────────────────────────
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: finalbid-user-service
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: default
      DB_URL: jdbc:postgresql://postgres:5432/finalbid
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      AWS_ENDPOINT_OVERRIDE: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - finalbid-net
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8081/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
  # ──────────────────────────────────────────────
  # AUCTION-SERVICE
  # ──────────────────────────────────────────────
  auction-service:
    build:
      context: ./auction-service
      dockerfile: Dockerfile
    container_name: finalbid-auction-service
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: default
      DB_URL: jdbc:postgresql://postgres:5432/finalbid
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AWS_ENDPOINT_OVERRIDE: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - finalbid-net
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
  # # ──────────────────────────────────────────────
  # # NOTIFICATION-SERVICE
  # # ──────────────────────────────────────────────
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: finalbid-notification-service
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: default
      DB_URL: jdbc:postgresql://postgres:5432/finalbid
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - finalbid-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10

  # # ──────────────────────────────────────────────
  # # NGINX (single entry point, simulates ALB)
  # # ──────────────────────────────────────────────
  # nginx:
  #   image: nginx:1.25-alpine
  #   container_name: finalbid-nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - auction-service
  #     - user-service
  #   networks:
  #     - finalbid-net

volumes:
  postgres_data:
  localstack_data:


networks:
  finalbid-net:
    driver: bridge
